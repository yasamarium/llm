<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen3 4B - Direct AI Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Markdown & Code Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark-dimmed.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="nav-left">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">
          <span class="brand">yasamarium</span>
          <span class="separator">/</span>
          <span class="app-name">llm</span>
        </div>
        <span class="badge model-badge">Qwen3 4B</span>
      </div>

      <div class="nav-right">
        <!-- Live Connection Status Pill -->
        <div id="statusBtn" class="status-pill checking">
          <span class="status-dot"></span>
          <span id="statusText">Connecting to runner...</span>
        </div>

        <button id="newChatBtn" class="btn btn-secondary" title="Start a new chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>New Chat</span>
        </button>
      </div>
    </header>

    <!-- Chat Messages Stream -->
    <main class="chat-viewport" id="chatViewport">
      <!-- Welcome Empty State -->
      <div class="welcome-container" id="welcomeContainer">
        <div class="welcome-card">
          <div class="welcome-avatar">⚡</div>
          <h1>Qwen3 4B Chat</h1>
          <p class="subtitle">Direct connection to GitHub Actions inference runner</p>
          
          <div class="quick-prompts">
            <button class="prompt-chip" data-prompt="Explain quantum computing in simple terms.">
              💡 Explain quantum computing
            </button>
            <button class="prompt-chip" data-prompt="Write a Python script to download a file with progress reporting.">
              🐍 Python download script
            </button>
            <button class="prompt-chip" data-prompt="What are the main advantages of running GGUF quantized models on CPU?">
              ⚙️ Why GGUF on CPU?
            </button>
            <button class="prompt-chip" data-prompt="Write a concise and professional email to follow up on a project proposal.">
              ✉️ Professional follow-up email
            </button>
          </div>
        </div>
      </div>

      <!-- Messages container -->
      <div class="messages-list" id="messagesList"></div>
    </main>

    <!-- Bottom Input Area -->
    <footer class="input-container">
      <div class="input-wrapper">
        <textarea 
          id="messageInput" 
          rows="1" 
          placeholder="Message Qwen3 4B... (Shift+Enter for newline)"
          autofocus
        ></textarea>
        
        <div class="input-actions">
          <button id="stopBtn" class="btn btn-stop hidden" title="Stop generating">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
            <span>Stop</span>
          </button>
          
          <button id="sendBtn" class="btn btn-send" title="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
      <div class="input-footer-text">
        <span>Running Qwen3 4B GGUF Q4_K_M • Powered by <strong>yasamarium/llmserver</strong></span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
