<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AS Cloud">
  <meta name="theme-color" content="#000000">
  <title>AS Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22black%22 stroke=%22white%22 stroke-width=%228%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22white%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Markdown & Code Highlight -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <!-- Popover Backdrop for Mobile Bottom Sheet -->
  <div id="popoverBackdrop" class="popover-backdrop hidden"></div>

  <div class="ios-app">
    <!-- Clean Minimalist iOS Navigation Bar with Safe Area Insets -->
    <header class="ios-navbar">
      <div class="nav-brand">
        <div class="brand-glyph">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <span class="brand-title">AS Cloud</span>
      </div>

      <!-- AS Cloud Live Status Indicator -->
      <div class="status-indicator">
        <div id="statusPill" class="ios-pill checking">
          <span class="status-pulse"></span>
          <span id="statusLabel">Connecting to AS cloud...</span>
        </div>
      </div>

      <!-- New Chat Action Button -->
      <div class="nav-actions">
        <button id="newChatBtn" class="ios-circle-btn" title="New Conversation" aria-label="New Conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Viewport -->
    <main class="ios-chat-viewport" id="chatViewport">
      <!-- Minimalist Welcome State -->
      <div class="welcome-view" id="welcomeView">
        <div class="welcome-content">
          <div class="ios-sparkle-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
            </svg>
          </div>
          <h1 class="welcome-heading" id="welcomeHeading">How can I help you?</h1>
          
          <div class="suggestion-pills">
            <button class="suggestion-chip" data-prompt="/play Alan Walker - Faded">
              🎵 /play Alan Walker - Faded
            </button>
            <button class="suggestion-chip" data-prompt="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
              ▶️ YouTube Video Downloader
            </button>
            <button class="suggestion-chip" data-prompt="/edit https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg Remove the background">
              🎨 /edit Remove background
            </button>
            <button class="suggestion-chip" data-prompt="Explain quantum computing in simple terms.">
              Explain quantum computing
            </button>
            <button class="suggestion-chip" data-prompt="Write a concise Python script to parse and clean a JSON dataset.">
              Python script to clean data
            </button>
            <button class="suggestion-chip" data-prompt="Draft a polite and professional follow-up email.">
              Professional follow-up email
            </button>
          </div>
        </div>
      </div>

      <!-- Messages Stream -->
      <div class="messages-flow" id="messagesFlow"></div>
    </main>

    <!-- Claude / DeepSeek Style Bottom Dock -->
    <footer class="ios-input-dock">
      <div class="input-container">
        <!-- Floating Glass Model Popover / Mobile Native Bottom Sheet -->
        <div id="modelPopover" class="ios-model-popover hidden" role="menu">
          <!-- Mobile Pull Handle -->
          <div class="sheet-drag-handle"></div>

          <div class="popover-header">
            <div class="popover-header-text">
              <span class="popover-title">Select AS Cloud Model</span>
              <span class="popover-subtitle">Multi-node load balanced</span>
            </div>
            <button id="closePopoverBtn" class="popover-close-btn" type="button" aria-label="Close Model Menu">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <div class="popover-models-list">
            <div class="popover-group-label">HIGH CAPACITY & REASONING</div>
            <button class="popover-item" data-model="r1" role="menuitem">
              <span class="popover-item-icon">🧠</span>
              <div class="popover-item-info">
                <div class="popover-item-name">DeepSeek High</div>
                <div class="popover-item-desc">Chain-of-thought deep reasoning & logic</div>
              </div>
              <span class="popover-node-count">3 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="qwen3b" role="menuitem">
              <span class="popover-item-icon">✨</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Qwen High</div>
                <div class="popover-item-desc">Flagship deep comprehension & knowledge</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="llama3b" role="menuitem">
              <span class="popover-item-icon">🦙</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Llama High</div>
                <div class="popover-item-desc">Meta advanced reasoning intelligence</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="coder" role="menuitem">
              <span class="popover-item-icon">💻</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Coder High</div>
                <div class="popover-item-desc">Code writing, architecture & debugging</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <div class="popover-group-label">MEDIUM CAPACITY</div>
            <button class="popover-item active" data-model="1.7b" role="menuitem">
              <span class="popover-item-icon">✦</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Qwen Medium</div>
                <div class="popover-item-desc">Balanced high-speed conversational model</div>
              </div>
              <span class="popover-node-count">4 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="gemma" role="menuitem">
              <span class="popover-item-icon">💎</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Gemma Medium</div>
                <div class="popover-item-desc">Google high-precision assistant</div>
              </div>
              <span class="popover-node-count">1 Node</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="math" role="menuitem">
              <span class="popover-item-icon">📐</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Math Medium</div>
                <div class="popover-item-desc">Mathematical formulas & step calculations</div>
              </div>
              <span class="popover-node-count">1 Node</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="phi" role="menuitem">
              <span class="popover-item-icon">🔬</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Phi Medium</div>
                <div class="popover-item-desc">Microsoft deep comprehension model</div>
              </div>
              <span class="popover-node-count">1 Node</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="smol" role="menuitem">
              <span class="popover-item-icon">🍃</span>
              <div class="popover-item-info">
                <div class="popover-item-name">SmolLM Medium</div>
                <div class="popover-item-desc">Compact conversational assistant</div>
              </div>
              <span class="popover-node-count">1 Node</span>
              <span class="popover-check">✓</span>
            </button>

            <div class="popover-group-label">LIGHTWEIGHT & FAST</div>
            <button class="popover-item" data-model="1b" role="menuitem">
              <span class="popover-item-icon">⚡</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Llama Lightweight</div>
                <div class="popover-item-desc">Instant low-latency responses</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="0.5b" role="menuitem">
              <span class="popover-item-icon">🪶</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Qwen Lightweight</div>
                <div class="popover-item-desc">Ultra-compact fast inference</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <div class="popover-group-label">CREATIVE & MULTIMODAL</div>
            <button class="popover-item" data-model="image" role="menuitem">
              <span class="popover-item-icon">🎨</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Image Generator</div>
                <div class="popover-item-desc">Real-time diffusion image generation</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>
          </div>
        </div>

        <!-- Claude / DeepSeek Bottom Composer Bar -->
        <div class="composer-top-bar">
          <div class="model-picker-wrapper">
            <button id="modelPickerBtn" class="model-picker-trigger" type="button" aria-haspopup="true" aria-expanded="false" title="Switch Model">
              <span class="model-picker-glyph" id="currentModelGlyph">✦</span>
              <span class="model-picker-name" id="currentModelName">Qwen Medium</span>
              <span class="model-picker-badge" id="currentModelBadge">4 Nodes</span>
              <svg class="chevron-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>
          </div>

          <!-- Quick Access Horizontal Pill Dock -->
          <div class="bottom-quick-pills" id="bottomQuickPills">
            <button class="quick-pill active" data-model="1.7b">Qwen Medium</button>
            <button class="quick-pill" data-model="r1">🧠 DeepSeek High</button>
            <button class="quick-pill" data-model="qwen3b">✨ Qwen High</button>
            <button class="quick-pill" data-model="llama3b">🦙 Llama High</button>
            <button class="quick-pill" data-model="coder">💻 Coder High</button>
            <button class="quick-pill" data-model="1b">⚡ Lightweight</button>
            <button class="quick-pill" data-model="image">🎨 Image</button>
          </div>
        </div>

        <!-- Attached Image Thumbnail Preview -->
        <div id="attachedImagePreview" class="attached-image-preview hidden">
          <img id="attachedThumb" class="attached-thumb" src="" alt="preview" />
          <span id="attachedFileName" class="attached-filename">image.png</span>
          <button id="removeAttachedBtn" type="button" class="remove-attached-btn" title="Remove attachment">✕</button>
        </div>

        <!-- Input Capsule -->
        <div class="input-capsule">
          <button id="attachBtn" type="button" class="attach-capsule-btn" title="Attach image to edit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <input type="file" id="imageFileInput" accept="image/*" class="hidden" />

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message"
            autocomplete="off"
            autocorrect="on"
            autocapitalize="sentences"
            spellcheck="true"
          ></textarea>

          <div class="dock-actions">
            <button id="stopBtn" class="stop-capsule-btn hidden" title="Stop">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <rect x="5" y="5" width="14" height="14" rx="2"/>
              </svg>
            </button>

            <button id="sendBtn" class="send-capsule-btn" title="Send" aria-label="Send">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- iOS 18 Fullscreen Image Lightbox Modal -->
  <div id="imageLightbox" class="ios-lightbox hidden" aria-modal="true" role="dialog">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-dialog">
      <div class="lightbox-header">
        <span id="lightboxTitle" class="lightbox-title">Image Preview</span>
        <button id="closeLightboxBtn" class="lightbox-close-btn" type="button" aria-label="Close Lightbox">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="lightbox-stage">
        <img id="lightboxImg" src="" alt="Full Preview" class="lightbox-image" />
      </div>
      <div class="lightbox-toolbar">
        <a id="lightboxSaveBtn" href="" download="as_image.jpg" class="media-btn-primary" title="Save Image">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Save Image</span>
        </a>
        <button id="lightboxCopyBtn" type="button" class="media-btn-secondary" title="Copy Link">
          <span>Copy URL</span>
        </button>
        <a id="lightboxTabBtn" href="" target="_blank" rel="noopener noreferrer" class="media-btn-secondary" title="Open in New Tab">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          <span>Open in Tab</span>
        </a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
