<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yasamarium / llm - Qwen3 4B</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Markdown & Code Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark-dimmed.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="nav-left">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">
          <span class="brand">yasamarium</span>
          <span class="separator">/</span>
          <span class="app-name">llm</span>
        </div>
        <span class="badge model-badge">Qwen3 4B</span>
      </div>

      <div class="nav-right">
        <!-- Live Connection Status Pill -->
        <button id="statusBtn" class="status-pill checking" title="Click to view or edit backend connection">
          <span class="status-dot"></span>
          <span id="statusText">Checking server...</span>
        </button>

        <button id="newChatBtn" class="btn btn-secondary" title="Start a new chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>New Chat</span>
        </button>

        <button id="settingsBtn" class="btn btn-icon" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Stream -->
    <main class="chat-viewport" id="chatViewport">
      <!-- Welcome Empty State -->
      <div class="welcome-container" id="welcomeContainer">
        <div class="welcome-card">
          <div class="welcome-avatar">⚡</div>
          <h1>How can Qwen3 4B help you?</h1>
          <p class="subtitle">Running CPU-quantized inference powered by <code>yasamarium/llmserver</code></p>
          
          <div class="quick-prompts">
            <button class="prompt-chip" data-prompt="Explain the difference between quantum computing and classical computing simply.">
              💡 Explain quantum computing
            </button>
            <button class="prompt-chip" data-prompt="Write a Python script to download a file with progress reporting and resume support.">
              🐍 Python download script
            </button>
            <button class="prompt-chip" data-prompt="What are the main advantages of running GGUF quantized models on CPU?">
              ⚙️ Why GGUF on CPU?
            </button>
            <button class="prompt-chip" data-prompt="Write a concise and professional email to follow up on a project proposal.">
              ✉️ Professional follow-up email
            </button>
          </div>
        </div>
      </div>

      <!-- Messages container -->
      <div class="messages-list" id="messagesList"></div>
    </main>

    <!-- Bottom Input Area -->
    <footer class="input-container">
      <div class="input-wrapper">
        <textarea 
          id="messageInput" 
          rows="1" 
          placeholder="Message Qwen3 4B... (Shift+Enter for newline)"
          autofocus
        ></textarea>
        
        <div class="input-actions">
          <button id="stopBtn" class="btn btn-stop hidden" title="Stop generating">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
            <span>Stop</span>
          </button>
          
          <button id="sendBtn" class="btn btn-send" title="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
      <div class="input-footer-text">
        <span>Powered by <strong>yasamarium/llmserver</strong> on GitHub Actions • Qwen3 4B GGUF Q4_K_M</span>
      </div>
    </footer>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Backend & Model Settings</h3>
        <button class="btn-close" id="closeSettingsBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="serverUrlInput">
            LLM Server URL
            <span class="hint">(Leave empty to use Vercel default or enter Cloudflare tunnel URL)</span>
          </label>
          <div class="input-group">
            <input type="text" id="serverUrlInput" placeholder="e.g. https://your-tunnel.trycloudflare.com">
            <button id="testConnectionBtn" class="btn btn-secondary">Test Connection</button>
          </div>
          <p id="connectionResult" class="field-feedback"></p>
        </div>

        <div class="form-group">
          <label for="apiKeyInput">
            API Key
            <span class="hint">(Matches API_KEY in yasamarium/llmserver)</span>
          </label>
          <input type="password" id="apiKeyInput" placeholder="sk-live-... (Optional if preset in Vercel)">
        </div>

        <div class="form-group">
          <label for="systemPromptInput">System Prompt</label>
          <textarea id="systemPromptInput" rows="2" placeholder="You are Qwen3 4B, a helpful and precise assistant."></textarea>
        </div>

        <div class="slider-row">
          <div class="form-group half">
            <label for="tempInput">Temperature: <span id="tempVal">0.7</span></label>
            <input type="range" id="tempInput" min="0" max="1.5" step="0.05" value="0.7">
          </div>
          <div class="form-group half">
            <label for="maxTokensInput">Max Tokens: <span id="maxTokensVal">512</span></label>
            <input type="range" id="maxTokensInput" min="64" max="2048" step="64" value="512">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="resetSettingsBtn" class="btn btn-text">Reset Defaults</button>
        <button id="saveSettingsBtn" class="btn btn-primary">Save & Apply</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
