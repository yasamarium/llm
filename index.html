<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AS Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22black%22 stroke=%22white%22 stroke-width=%228%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22white%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Markdown & Code Highlight -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div class="ios-app">
    <!-- iOS Navigation Bar -->
    <header class="ios-navbar">
      <div class="nav-brand">
        <div class="brand-glyph">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        
        <!-- Apple-style Segmented Model Switcher -->
        <div class="ios-segmented-control" id="modelSwitcher">
          <button class="segment-btn active" id="btn17B" data-model="1.7b" title="Qwen3 1.7B Cluster">
            1.7B
          </button>
          <button class="segment-btn" id="btn1B" data-model="1b" title="1B Ultra Fast Node">
            1B
          </button>
          <button class="segment-btn" id="btn05B" data-model="0.5b" title="0.5B Lightweight Node">
            0.5B
          </button>
        </div>
      </div>

      <!-- AS Cloud Status Indicator -->
      <div class="status-indicator">
        <div id="statusPill" class="ios-pill checking">
          <span class="status-pulse"></span>
          <span id="statusLabel">Connecting to AS cloud...</span>
        </div>
      </div>

      <!-- Action Button -->
      <div class="nav-actions">
        <button id="newChatBtn" class="ios-circle-btn" title="New Conversation" aria-label="New Conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Viewport -->
    <main class="ios-chat-viewport" id="chatViewport">
      <!-- Minimalist Welcome State -->
      <div class="welcome-view" id="welcomeView">
        <div class="welcome-content">
          <div class="ios-sparkle-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
            </svg>
          </div>
          <h1 class="welcome-heading" id="welcomeHeading">How can I help you?</h1>
          
          <div class="suggestion-pills">
            <button class="suggestion-chip" data-prompt="Explain quantum computing in simple terms.">
              Explain quantum computing
            </button>
            <button class="suggestion-chip" data-prompt="Write a concise Python script to parse and clean a JSON dataset.">
              Python script to clean data
            </button>
            <button class="suggestion-chip" data-prompt="Draft a polite and professional follow-up email.">
              Professional follow-up email
            </button>
            <button class="suggestion-chip" data-prompt="Summarize the core principles of effective system design.">
              Core system design principles
            </button>
          </div>
        </div>
      </div>

      <!-- Messages Stream -->
      <div class="messages-flow" id="messagesFlow"></div>
    </main>

    <!-- iOS Bottom Input Capsule -->
    <footer class="ios-input-dock">
      <div class="input-capsule">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message"
          autocomplete="off"
          autocorrect="on"
          autocapitalize="sentences"
          spellcheck="true"
        ></textarea>

        <div class="dock-actions">
          <button id="stopBtn" class="stop-capsule-btn hidden" title="Stop">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="2"/>
            </svg>
          </button>

          <button id="sendBtn" class="send-capsule-btn" title="Send" aria-label="Send">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
