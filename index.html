<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AS Cloud">
  <meta name="theme-color" content="#000000">
  <title>AS Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22black%22 stroke=%22white%22 stroke-width=%228%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22white%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Markdown & Code Highlight -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <!-- Popover Backdrop for Mobile Bottom Sheet -->
  <div id="popoverBackdrop" class="popover-backdrop hidden"></div>

  <div class="ios-app">
    <!-- Clean Minimalist iOS Navigation Bar with Safe Area Insets -->
    <header class="ios-navbar">
      <div class="nav-brand">
        <div class="brand-glyph">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <span class="brand-title">AS Cloud</span>
      </div>

      <!-- AS Cloud Live Status Indicator -->
      <div class="status-indicator">
        <div id="statusPill" class="ios-pill checking">
          <span class="status-pulse"></span>
          <span id="statusLabel">Connecting to AS cloud...</span>
        </div>
      </div>

      <!-- New Chat Action Button -->
      <div class="nav-actions">
        <button id="newChatBtn" class="ios-circle-btn" title="New Conversation" aria-label="New Conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Viewport -->
    <main class="ios-chat-viewport" id="chatViewport">
      <!-- Minimalist Welcome State -->
      <div class="welcome-view" id="welcomeView">
        <div class="welcome-content">
          <div class="ios-sparkle-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
            </svg>
          </div>
          <h1 class="welcome-heading" id="welcomeHeading">How can I help you?</h1>
          
          <div class="suggestion-pills">
            <button class="suggestion-chip" data-prompt="Explain quantum computing in simple terms.">
              Explain quantum computing
            </button>
            <button class="suggestion-chip" data-prompt="Write a concise Python script to parse and clean a JSON dataset.">
              Python script to clean data
            </button>
            <button class="suggestion-chip" data-prompt="Draft a polite and professional follow-up email.">
              Professional follow-up email
            </button>
            <button class="suggestion-chip" data-prompt="Summarize the core principles of effective system design.">
              Core system design principles
            </button>
          </div>
        </div>
      </div>

      <!-- Messages Stream -->
      <div class="messages-flow" id="messagesFlow"></div>
    </main>

    <!-- Claude / DeepSeek Style Bottom Dock -->
    <footer class="ios-input-dock">
      <div class="input-container">
        <!-- Floating Glass Model Popover / Mobile Native Bottom Sheet -->
        <div id="modelPopover" class="ios-model-popover hidden" role="menu">
          <!-- Mobile Pull Handle -->
          <div class="sheet-drag-handle"></div>

          <div class="popover-header">
            <div class="popover-header-text">
              <span class="popover-title">Select AS Cloud Model</span>
              <span class="popover-subtitle">Multi-node load balanced</span>
            </div>
            <button id="closePopoverBtn" class="popover-close-btn" type="button" aria-label="Close Model Menu">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <div class="popover-models-list">
            <div class="popover-group-label">REASONING & HIGH CAPACITY</div>
            <button class="popover-item active" data-model="1.7b" role="menuitem">
              <span class="popover-item-icon">✦</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Qwen 1.7B</div>
                <div class="popover-item-desc">High-speed conversational intelligence</div>
              </div>
              <span class="popover-node-count">4 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="r1" role="menuitem">
              <span class="popover-item-icon">🧠</span>
              <div class="popover-item-info">
                <div class="popover-item-name">DeepSeek R1</div>
                <div class="popover-item-desc">Chain-of-thought reasoning & logic</div>
              </div>
              <span class="popover-node-count">3 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="llama3b" role="menuitem">
              <span class="popover-item-icon">🦙</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Llama 3.2 3B</div>
                <div class="popover-item-desc">Meta high-capability 3B model</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="qwen3b" role="menuitem">
              <span class="popover-item-icon">✨</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Qwen 2.5 3B</div>
                <div class="popover-item-desc">Flagship 3B comprehension & depth</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="coder" role="menuitem">
              <span class="popover-item-icon">💻</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Qwen 2.5 Coder</div>
                <div class="popover-item-desc">Code writing, architecture & debugging</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <div class="popover-group-label">SPECIALIZED & LIGHTWEIGHT</div>
            <button class="popover-item" data-model="gemma" role="menuitem">
              <span class="popover-item-icon">💎</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Gemma 2 2B</div>
                <div class="popover-item-desc">Google Gemma 2 high-precision output</div>
              </div>
              <span class="popover-node-count">1 Node</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="math" role="menuitem">
              <span class="popover-item-icon">📐</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Qwen Math</div>
                <div class="popover-item-desc">Mathematical formulas & step calculations</div>
              </div>
              <span class="popover-node-count">1 Node</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="phi" role="menuitem">
              <span class="popover-item-icon">🔬</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Phi-3.5 Mini</div>
                <div class="popover-item-desc">Microsoft 3.8B deep comprehension</div>
              </div>
              <span class="popover-node-count">1 Node</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="1b" role="menuitem">
              <span class="popover-item-icon">⚡</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Llama 3.2 1B</div>
                <div class="popover-item-desc">Rapid conversational responses</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="smol" role="menuitem">
              <span class="popover-item-icon">🍃</span>
              <div class="popover-item-info">
                <div class="popover-item-name">SmolLM2 1.7B</div>
                <div class="popover-item-desc">HuggingFace lightweight assistant</div>
              </div>
              <span class="popover-node-count">1 Node</span>
              <span class="popover-check">✓</span>
            </button>

            <button class="popover-item" data-model="0.5b" role="menuitem">
              <span class="popover-item-icon">🪶</span>
              <div class="popover-item-info">
                <div class="popover-item-name">Qwen 0.5B</div>
                <div class="popover-item-desc">Instant low-latency CPU inference</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>

            <div class="popover-group-label">DIFFUSION</div>
            <button class="popover-item" data-model="image" role="menuitem">
              <span class="popover-item-icon">🎨</span>
              <div class="popover-item-info">
                <div class="popover-item-name">SD-Turbo Image</div>
                <div class="popover-item-desc">High-speed 1-step diffusion generation</div>
              </div>
              <span class="popover-node-count">2 Nodes</span>
              <span class="popover-check">✓</span>
            </button>
          </div>
        </div>

        <!-- Claude / DeepSeek Bottom Composer Bar -->
        <div class="composer-top-bar">
          <div class="model-picker-wrapper">
            <button id="modelPickerBtn" class="model-picker-trigger" type="button" aria-haspopup="true" aria-expanded="false" title="Switch Model">
              <span class="model-picker-glyph" id="currentModelGlyph">✦</span>
              <span class="model-picker-name" id="currentModelName">Qwen 1.7B</span>
              <span class="model-picker-badge" id="currentModelBadge">4 Nodes</span>
              <svg class="chevron-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>
          </div>

          <!-- Quick Access Horizontal Pill Dock -->
          <div class="bottom-quick-pills" id="bottomQuickPills">
            <button class="quick-pill active" data-model="1.7b">1.7B</button>
            <button class="quick-pill" data-model="r1">🧠 R1</button>
            <button class="quick-pill" data-model="coder">💻 Coder</button>
            <button class="quick-pill" data-model="llama3b">🦙 Llama 3B</button>
            <button class="quick-pill" data-model="qwen3b">✨ Qwen 3B</button>
            <button class="quick-pill" data-model="1b">1B</button>
            <button class="quick-pill" data-model="0.5b">0.5B</button>
            <button class="quick-pill" data-model="image">🎨 Image</button>
          </div>
        </div>

        <!-- Input Capsule -->
        <div class="input-capsule">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message"
            autocomplete="off"
            autocorrect="on"
            autocapitalize="sentences"
            spellcheck="true"
          ></textarea>

          <div class="dock-actions">
            <button id="stopBtn" class="stop-capsule-btn hidden" title="Stop">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <rect x="5" y="5" width="14" height="14" rx="2"/>
              </svg>
            </button>

            <button id="sendBtn" class="send-capsule-btn" title="Send" aria-label="Send">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
